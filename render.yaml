# Blueprint Render — https://render.com/docs/blueprint-spec
#
# PROFILO ATTUALE: production, con apertura anticipata per i test del team (dall'8 ottobre)
# Le giocate sono aperte e vere: il team prova con pagamenti reali nei negozi. La pagina
# mostra il badge rosso «Finestra di prova» accanto al countdown finché vale
# NEXT_PUBLIC_CONTEST_VALID_FROM. Le rilevazioni si salvano su /var/data come prima.
#
# PRIMA DEL 19 OTTOBRE, per l'apertura vera:
#   1. dalla Shell di Render: npm run reset-prove (mostra cosa sposta), poi npm run reset-prove -- --yes
#   2. togliere NEXT_PUBLIC_CONTEST_VALID_FROM: tornano le date vere di lib/constants.js
# Con profilo production e disco non scrivibile il health check risponde 503 e il deploy
# risulta degradato: è voluto, meglio un allarme che giocate perse.

services:
  - type: web
    name: naka-paga-in-crypto
    runtime: node
    region: frankfurt # il più vicino alla Svizzera tra quelli disponibili
    plan: starter # il disco persistente non esiste sul piano free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true

    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5 # foto di rilevazioni e scontrini ~1 MB l'una: 5 GB coprono ampiamente l'evento

    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Il codice scrive già ogni data nel fuso di Lugano (lib/time.js). Questo vale per tutto il
      # resto: log, script lanciati dalla Shell, qualunque data che sfuggisse alla regola.
      - key: TZ
        value: Europe/Zurich
      - key: NEXT_PUBLIC_DEPLOY_PROFILE
        value: production
      # Apertura anticipata per i test: da togliere prima del 19 ottobre, insieme a reset-prove.
      - key: NEXT_PUBLIC_CONTEST_VALID_FROM
        value: "2026-10-08T00:00:00+02:00"
      - key: DATA_DIR
        value: /var/data # deve coincidere con disk.mountPath
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # URL pubblico definitivo
      - key: MAIL_PROVIDER_API_KEY
        sync: false # chiave provider email (serve solo in production)
      - key: MAIL_FROM
        sync: false # es. "NAKA <assistenza@naka.com>"
      - key: RILEVAZIONI_OPERATORI
        sync: false # "Nome:PIN,Nome:PIN" — senza, l'area /rilevazioni resta aperta
      - key: RILEVAZIONI_ADMIN
        sync: false # nomi (fra quelli qui sopra) che vedono /rilevazioni/admin, foto ed esportazioni
      # Estrazione automatica (lib/server/draw-scheduler.js): si accende da sola con il profilo
      # production e resta spenta in demo. Per procedere a mano dalla Shell con `npm run draw`:
      # - key: DRAW_AUTOMATIC
      #   value: "off"
      - key: RILEVAZIONI_SECRET
        sync: false # chiave fissa per le sessioni: così aggiungere un rilevatore non disconnette gli altri
      - key: RILEVAZIONI_CODE
        sync: false # alternativa: un codice condiviso, senza identità del rilevatore
